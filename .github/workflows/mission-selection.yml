name: Mission selection
on: [push, pull_request]
jobs:
  selection-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests/mission_selection -v
      - run: python -m unittest discover -s boat_ws/tests -v
