uuv_camera:
  ros__parameters:
    source: /dev/video0
    width: 1280
    height: 720
    fps: 15.0
    frame_id: uuv_camera_optical_frame
    reconnect_sec: 2.0

uuv_yolo_detector:
  ros__parameters:
    backend: ultralytics
    model_path: models/uuv_yolo.pt
    roboflow_model_id: ''
    roboflow_api_url: http://127.0.0.1:9001
    roboflow_api_key_env: ROBOFLOW_API_KEY
    confidence: 0.45
    imgsz: 640
    device: '0'
    max_fps: 12.0
    publish_annotated: true

uuv_status_aggregator:
  ros__parameters:
    state_timeout: 1.5
    depth_sign: -1.0
    publish_rate: 5.0

uuv_safety_supervisor:
  ros__parameters:
    allowed_modes: GUIDED
    state_timeout: 1.0
    depth_timeout: 1.0
    depth_sign: -1.0
    sensor_timeout: 2.0
    require_depth: true
    require_camera: true
    require_perception: true

uuv_mission_manager:
  ros__parameters:
    enabled: false

uuv_command_bridge:
  ros__parameters:
    input_topic: /uuv/control/cmd_vel
    output_topic: /uuv/mavros/setpoint_velocity/cmd_vel
    authorized_topic: /uuv/safety/authorized
    deadman_sec: 0.35
    publish_rate: 20.0
    max_linear_xy: 0.5
    max_linear_z: 0.3
    max_yaw_rate: 0.5

uuv_dashboard_bridge:
  ros__parameters:
    host: 0.0.0.0
    port: 8770
    telemetry_hz: 5.0
