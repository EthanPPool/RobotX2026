/**:
  ros__parameters:
    # Set this true only after all vehicles use the same surveyed ENU water datum.
    datum_configured: false
    map_frame: robotx_map
    origin_latitude: 0.0
    origin_longitude: 0.0
    water_altitude: 0.0
    detection_timeout: 0.5
    min_confidence: 0.6

usv_buoy_interpretation:
  ros__parameters:
    detections_topic: /perception/usv/color_detections
    camera_info_topic: /usv/camera/color/camera_info
    objects_topic: /perception/objects
    output_topic: /perception/buoys/usv
    max_sync: 0.1
    max_pixel_distance: 80.0
    bbox_padding: 8.0
    geometry_uncertainty: 0.25
    calibration_timeout: 0.1
    allow_static_calibration: false

uav_buoy_interpretation:
  ros__parameters:
    detections_topic: /perception/uav/color_detections
    camera_info_topic: /uav/downward/camera_info
    output_topic: /perception/buoys/uav
    calibration_timeout: 0.1
    allow_static_calibration: false
    max_mapping_range: 60.0
    position_uncertainty: 0.75
    pixel_uncertainty: 2.0
    # Bottom-center for oblique view; use 0.0 for a calibrated nadir-center anchor.
    anchor_fraction: 0.5
    buoy_radius: 0.2
    max_buoy_height: 1.5

buoy_tracker:
  ros__parameters:
    source_mode: usv_only
    merge_distance: 0.7
    usv_timeout: 1.5
    uav_timeout: 5.0
    obstacle_retention: 120.0
    max_uncertainty: 2.0
    max_tracks: 300
