mock_mavros:
  ros__parameters:
    state_topic: /mock_mavros/state
    setpoint_topic: /mock_mavros/setpoint_velocity/cmd_vel
    battery_topic: /mock_mavros/battery
    gps_topic: /mock_mavros/global_position/raw/fix
    local_position_topic: /mock_mavros/local_position/pose
    arming_service: /mock_mavros/cmd/arming
    set_mode_service: /mock_mavros/set_mode
    takeoff_service: /mock_mavros/cmd/takeoff
    land_service: /mock_mavros/cmd/land
    connected: true
    armed: false
    mode: GUIDED
    battery_percentage: 0.80
    battery_voltage: 15.2
    gps_valid: true
    local_position_valid: true
    latitude: 30.2241
    longitude: -92.0198
    altitude: 0.0
    publish_rate: 10.0

vehicle_manager:
  ros__parameters:
    state_topic: /mock_mavros/state
    safety_status_topic: /vehicle/safety_status
    arming_service: /mock_mavros/cmd/arming
    set_mode_service: /mock_mavros/set_mode
    takeoff_service: /mock_mavros/cmd/takeoff
    command_execution_enabled: true
    service_timeout: 2.0
    safety_timeout: 0.75
    guided_mode: GUIDED
    land_mode: LAND
    rtl_mode: RTL
    allowed_requested_modes: [GUIDED, LAND, RTL, LOITER]
    minimum_takeoff_altitude: 1.0
    maximum_takeoff_altitude: 5.0

safety_supervisor:
  ros__parameters:
    state_topic: /mock_mavros/state
    battery_topic: /mock_mavros/battery
    gps_topic: /mock_mavros/global_position/raw/fix
    local_position_topic: /mock_mavros/local_position/pose
    autonomy_status_topic: /vehicle/autonomy_status
    mission_command_topic: /mission/command
    safety_status_topic: /vehicle/safety_status
    allowed_modes: [GUIDED]
    minimum_battery_percentage: 0.20
    telemetry_timeout: 0.75
    mission_timeout: 0.75
    publish_rate: 10.0

mock_target_publisher:
  ros__parameters:
    topic: /perception/target_raw
    x: 2.0
    y: 0.5
    z: 0.0
    rate: 5.0

mavros_command_bridge:
  ros__parameters:
    input_topic: /control/cmd_vel
    output_topic: /mock_mavros/setpoint_velocity/cmd_vel
    state_topic: /mock_mavros/state
    status_topic: /vehicle/autonomy_status
    safety_status_topic: /vehicle/safety_status
    autonomy_enabled: false
    allowed_modes: [GUIDED]
    require_safety_supervisor: true
    safety_timeout: 0.75
    deadman_timeout: 0.30
    publish_rate: 20.0
    max_horizontal_speed: 1.50
    max_vertical_speed: 0.75
    max_yaw_rate: 0.75

velocity_guidance:
  ros__parameters:
    input_topic: /mission/command
    output_topic: /control/cmd_vel
    max_horizontal_speed: 1.00
    max_vertical_speed: 0.50
    max_yaw_rate: 0.50

target_filter:
  ros__parameters:
    input_topic: /perception/target_raw
    output_topic: /perception/target
    required_frame: base_link
    max_distance: 30.0

target_mission:
  ros__parameters:
    target_topic: /perception/target
    command_topic: /mission/command
    target_timeout: 0.50
    control_rate: 10.0
    kp_xy: 0.35
    kp_z: 0.35
    desired_forward_distance: 1.50
    xy_deadband: 0.15
    z_deadband: 0.15
    max_horizontal_speed: 0.75
    max_vertical_speed: 0.35
