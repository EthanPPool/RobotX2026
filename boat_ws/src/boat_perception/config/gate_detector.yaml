gate_detector:
  ros__parameters:
    objects_topic: "/perception/objects"
    gates_topic: "/perception/gates"
    gate_topic: "/perception/gate"
    marker_topic: "/perception/gate_markers"

    # Validated 3D buoy-pair requirements.
    min_buoy_confidence: 0.60

    # RobotX gate separation: 6-10 ft = 1.83-3.05 m.
    min_gate_width: 1.83
    max_gate_width: 3.05
    nominal_gate_width: 2.44
    gate_width_tolerance: 0.75

    # Accept a real gate while the boat is yawed relative to it.
    max_gate_skew_deg: 55.0

    min_center_x: 0.75
    max_center_x: 10.0
    min_gate_confidence: 0.72

    # Confirm each marker pair separately, on distinct sensor timestamps.
    confirm_hits: 2
    publish_rate: 10.0
    hold_timeout: 1.80
    max_buoys: 64
    max_gate_candidates: 64
    # Enable only when a color sensor supplies reliable red/green labels.
    require_red_green: false
