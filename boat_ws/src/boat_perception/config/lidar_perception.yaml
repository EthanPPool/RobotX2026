pointcloud_to_laserscan:
  ros__parameters:
    target_frame: "base_link"
    transform_tolerance: 0.05

    # 3D point-cloud slice converted into the 2D perception scan.
    min_height: -0.20
    max_height: 1.50

    angle_min: -1.57079632679
    angle_max: 1.57079632679
    angle_increment: 0.00872664626
    scan_time: 0.055

    range_min: 0.50
    range_max: 30.0
    use_inf: true


buoy_detector:
  ros__parameters:
    scan_topic: "/perception/scan"
    objects_topic: "/perception/objects"
    markers_topic: "/perception/object_markers"

    # Region of interest.
    min_range: 0.75
    max_range: 25.0
    min_forward_x: 0.50
    max_lateral: 8.0

    # Reject objects more than 55 degrees from the bow.
    max_bearing_deg: 55.0

    # Adaptive cluster segmentation.
    cluster_gap_base: 0.10
    cluster_gap_per_meter: 0.012

    # Candidate geometry.
    min_cluster_points: 2
    good_cluster_points: 7

    min_cluster_width: 0.03
    max_cluster_width: 0.90
    max_cluster_depth: 0.90
    max_radial_span: 0.45

    nominal_buoy_width: 0.35
    size_tolerance: 0.30

    # Shape / confidence scoring.
    min_pca_ratio: 0.002
    good_pca_ratio: 0.050
    good_convexity: 0.025
    min_candidate_confidence: 0.30

    # Temporal confirmation.
    confirm_hits: 3
    max_track_misses: 3
    publish_misses: 0
    association_distance: 0.55
    track_alpha: 0.65


gate_detector:
  ros__parameters:
    objects_topic: "/perception/objects"
    gate_topic: "/perception/gate"
    marker_topic: "/perception/gate_markers"

    # Individual buoy requirements.
    min_buoy_confidence: 0.40

    # Current bench-test gate geometry.
    #
    # IMPORTANT:
    # These values are tuned for the approximately 1.4 m center-to-center
    # gate currently being tested. Change these if the physical water-test
    # gate spacing is substantially different.
    min_gate_width: 1.00
    max_gate_width: 1.80
    nominal_gate_width: 1.40
    gate_width_tolerance: 0.35

    # The two gate markers should be at roughly the same forward distance.
    max_depth_difference: 1.20

    # Require the pair to be predominantly separated laterally.
    min_lateral_fraction: 0.75

    # Gate search region.
    min_center_x: 0.60
    max_center_x: 15.0

    # Final gate confidence requirement.
    min_gate_confidence: 0.60

    # Temporal gate confirmation.
    confirm_hits: 3
    max_misses: 2
    center_association_distance: 0.80
    width_association_tolerance: 0.90
    track_alpha: 0.65
