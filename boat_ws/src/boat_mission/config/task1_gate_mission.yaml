task1_gate_mission:
  ros__parameters:
    gate_topic: "/perception/gate"
    target_topic: "/mission/target"
    state_topic: "/mission/state"
    diagnostics_topic: "/mission/diagnostics"
    vehicle_state_topic: "/mavros/state"
    local_position_topic: "/mavros/local_position/pose"

    enabled: true
    gates_required: 2
    min_gate_confidence: 0.75

    # Preserve the latest validated two_gate_follower motion setting.
    track_speed: 0.02
    pass_speed: 0.02

    # Fixed-frame passage logic ported from two_gate_follower.
    pass_commit_distance: 2.0
    pass_target_distance: 1.5
    pass_clear_distance: 1.0
    local_pose_timeout: 1.50
    pass_edge_margin: 0.0
