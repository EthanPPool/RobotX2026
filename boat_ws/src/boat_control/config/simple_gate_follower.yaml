simple_gate_follower:
  ros__parameters:
    gate_topic: "/perception/gate"
    cmd_topic: "/control/cmd_vel"

    enabled: true

    min_gate_confidence: 0.75
    gate_timeout: 0.30

    forward_speed: 0.12
    yaw_kp: 0.60
    max_yaw_rate: 0.12
    forward_enable_angle_deg: 20.0

    min_gate_x: 0.50

    pass_arm_distance: 1.50
    pass_loss_timeout: 0.40
    pass_jump_distance: 1.00
