target_controller:
  ros__parameters:
    target_topic: "/mission/target"
    cmd_topic: "/control/cmd_vel"
    diagnostics_topic: "/control/diagnostics"

    # Preserve the current two_gate_follower steering law.
    yaw_kp: 0.60
    max_yaw_rate: 0.12
    max_forward_speed: 0.15
    target_timeout: 0.30
    forward_angle_limit_deg: 20.0
