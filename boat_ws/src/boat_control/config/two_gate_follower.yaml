two_gate_follower:
  ros__parameters:
    gate_topic: "/perception/gate"
    output_topic: "/control/cmd_vel"
    state_topic: "/mission/state"
    vehicle_state_topic: "/mavros/state"
    local_position_topic: "/mavros/local_position/pose"

    enabled: true
    gates_required: 2
    min_gate_confidence: 0.75
    gate_timeout: 0.30

    forward_speed: 0.02
    yaw_kp: 0.60
    max_yaw_rate: 0.12
    forward_angle_limit_deg: 20.0

    pass_commit_distance: 2.0
    pass_target_distance: 1.5
    pass_clear_distance: 1.0
    local_pose_timeout: 1.50
    pass_edge_margin: 0.0

    # Final Task 1 behavior
    complete_mode: "LOITER"
    complete_mode_retry_period: 0.50
